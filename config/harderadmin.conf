# ==============================================================================
# HarderAdmin Configuration
# ==============================================================================
#
# Format: KEY="value" (one per line). This file is parsed, not executed.
# Unknown keys and invalid values are ignored with a warning.
# Paths must be absolute.

# Reserved for future translations (messages are English for now).
LANGUAGE="de"
THEME="default"

# DEBUG="true" forces LOG_LEVEL="DEBUG".
DEBUG="false"

# DEBUG | INFO | WARN | ERROR
LOG_LEVEL="INFO"
LOG_DIR="/var/log/harderadmin"

# Files are backed up before every change. Rollback needs backups.
BACKUP_ENABLED="true"
BACKUP_DIR="/var/lib/harderadmin/backups"

# SYS-004: reverse path filter mode.
# 1 = strict (CIS recommendation)
# 2 = loose, use for multi-homed hosts or asymmetric routing
SYSCTL_RP_FILTER="1"
