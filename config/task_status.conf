#!/usr/bin/env bash
#
# ==============================================================================
# HarderAdmin
# config/task_status.conf
# ==============================================================================
#
# READY          : Task can be executed (finding / not yet applied).
# COMPLETED      : Desired state is in place.
# BLOCKED        : Task cannot run on this system right now (prerequisite).
# ERROR          : Task failed or the result could not be determined.
# NOT_APPLICABLE : Task does not apply to this system (e.g. service missing).

# shellcheck disable=SC2034

readonly HA_TASK_READY=0
readonly HA_TASK_COMPLETED=10
readonly HA_TASK_BLOCKED=20
readonly HA_TASK_ERROR=30
readonly HA_TASK_NOT_APPLICABLE=40
